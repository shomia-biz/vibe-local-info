name: Fetch Bokjiro Data (Cron)

on:
  schedule:
    - cron: '40 22 * * *' # 한국 시간 매일 아침 7시 40분
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Run Fetch Bokjiro API Script
        env:
          BOKJIRO_API_KEY: ${{ secrets.BOKJIRO_API_KEY || secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-bokjiro-api.js
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/local-info.json
          git commit -m "Auto-update Bokjiro API data [skip ci]" || echo "No changes to commit"
          git push
