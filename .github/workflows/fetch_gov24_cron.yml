name: Fetch Gov24 Data

on:
  schedule:
    - cron: '0 19 * * *' # 매일 한국시간 오전 4시 (UTC 19시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-gov24:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run script
        run: node scripts/fetch-public-data.js
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/local-info.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "자동 업데이트: 정부24 공공데이터 수집"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
