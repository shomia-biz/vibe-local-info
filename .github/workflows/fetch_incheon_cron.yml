name: Fetch Incheon Data

on:
#  schedule:
#    - cron: '0 21 * * *' # 매일 한국시간 오전 6시 (UTC 21시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-incheon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run script
        run: node scripts/fetch-incheon-api.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INCHEON_DATA_API_KEY: ${{ secrets.INCHEON_DATA_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/local-info.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "자동 업데이트: 인천 데이터 수집"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
