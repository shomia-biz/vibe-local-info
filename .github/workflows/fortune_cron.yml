name: Daily Fortune Generator

on:
  schedule:
    # 매일 한국 시간 새벽 1시에 실행 (UTC 기준 전날 16시 0분)
    - cron: '0 18 * * *'
  workflow_dispatch: # 깃허브 웹사이트에서 수동으로 버튼을 눌러서 실행할 수 있게 해주는 옵션

jobs:
  generate-fortune:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 파이썬(Python) 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 파이썬 패키지 설치
      run: pip install google-generativeai

    - name: 운세 생성 파이썬 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scripts/generate_fortune.py

    - name: 변경된 JSON 파일 깃허브에 저장(Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data/today_fortune.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: 매일 새벽 자동 운세 업데이트 🔮"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes to commit"
        fi
